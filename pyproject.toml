[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rootzengine"
version = "0.1.0"
description = "AI-Powered Agentic Reggae Music Analysis and Generation Toolkit"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "RootzEngine Team", email = "info@rootzengine.com"}
]
keywords = [
    "music",
    "audio",
    "reggae",
    "ai",
    "machine-learning",
    "midi",
    "audio-analysis",
    "music-generation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Core
    "PyYAML>=6.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "typer>=0.9.0",
    "python-dotenv>=1.0.0",

    # API
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "psutil>=5.9.0",

    # Audio processing
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
    "numpy>=1.24.0,<2.0.0",
    "scipy>=1.10.0",
    "audioread>=3.0.0",

    # MIDI
    "pretty_midi>=0.2.10",
    "mido>=1.2.10",
    "music21>=9.1.0",

    # Machine Learning
    "torch>=2.0.0",
    "scikit-learn>=1.3.0",
    "tensorboard>=2.13.0",

    # Storage
    "azure-storage-blob>=12.16.0",
    "azure-identity>=1.13.0",

    # Utilities
    "click>=8.1.0",
    "rich>=13.0.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
# Development dependencies
dev = [
    "pytest>=7.3.1",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.11.0",
    "black>=23.3.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.3.0",
    "pre-commit>=3.3.0",
    "ipython>=8.0.0",
    "ipdb>=0.13.0",
]

# Audio separation (heavy dependency, optional)
separation = [
    "demucs>=4.0.0",
]

# Beat tracking and rhythm analysis
rhythm = [
    "madmom>=0.16.1,<0.17.0",
    "Cython>=0.29.0",
]

# Documentation
docs = [
    "sphinx>=6.0.0",
    "sphinx-rtd-theme>=1.2.0",
    "sphinx-autodoc-typehints>=1.23.0",
]

# All optional dependencies
all = [
    "rootzengine[dev,separation,rhythm,docs]",
]

[project.scripts]
rootzengine = "rootzengine.cli:app"

[project.urls]
Homepage = "https://github.com/your-username/rootzengine"
Documentation = "https://rootzengine.readthedocs.io"
Repository = "https://github.com/your-username/rootzengine"
Issues = "https://github.com/your-username/rootzengine/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["rootzengine*"]
exclude = ["tests*"]

# Black configuration
[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

# isort configuration
[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_gitignore = true

# pytest configuration
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=rootzengine",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "requires_audio: marks tests that require audio files",
    "requires_gpu: marks tests that require GPU",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# Coverage configuration
[tool.coverage.run]
source = ["src/rootzengine"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
]
branch = true

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

# MyPy configuration
[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "librosa.*",
    "demucs.*",
    "madmom.*",
    "music21.*",
    "pretty_midi.*",
    "mido.*",
]
ignore_missing_imports = true
